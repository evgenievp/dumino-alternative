<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f4efe6" />
  <title>Думино</title>

  <style>
    :root {
      --bg: #f4efe6;
      --card: #fffaf2;
      --text: #2f2a24;
      --accent: #5c7c55;
      --accent-dark: #3f5f3a;
      --selected: #f2c66d;
      --border: #d9cfbf;
      --danger: #b04a3f;
      --found-bg: #d9ecc9;
      --found-border: #7fa869;
      --found-text: #2f5c26;
      --missed-bg: #efe9dd;
      --missed-border: #d9cfbf;
      --missed-text: #8a8071;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 12px;
      touch-action: none;
    }

    .app {
      width: min(100%, 620px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(36px, 10vw, 56px);
    }

    .subtitle {
      margin: -4px 0 2px;
      text-align: center;
      font-size: 18px;
      opacity: 0.78;
    }

    .panel {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 5px 16px rgba(50, 40, 30, 0.08);
    }

    .status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      font-size: clamp(17px, 4.5vw, 22px);
      font-weight: 800;
    }

    .current-word {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 900;
      letter-spacing: 2px;
      overflow-wrap: anywhere;
    }

    .message {
      min-height: 27px;
      text-align: center;
      font-size: 19px;
      font-weight: 800;
    }

    .message.ok {
      color: var(--accent-dark);
    }

    .message.bad {
      color: var(--danger);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      user-select: none;
    }

    .tile {
      aspect-ratio: 1 / 1;
      min-height: 68px;
      border: 3px solid var(--border);
      border-radius: 17px;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(42px, 13vw, 68px);
      line-height: 1;
      font-weight: 950;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.08s ease;
      touch-action: none;
    }

    .tile.selected {
      background: var(--selected);
      border-color: #c89a3d;
      transform: scale(0.92);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 16px 12px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .secondary {
      background: #e7dfd2;
      color: var(--text);
    }

    .found-title {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .found-words {
      min-height: 42px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .word-chip {
      background: #e7efdf;
      border: 1px solid #b8c9aa;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 17px;
      font-weight: 800;
    }

    .result-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
      touch-action: auto;
    }

    .result-overlay.visible {
      display: flex;
    }

    .result-card {
      width: min(100%, 460px);
      max-height: min(88vh, 720px);
      overflow-y: auto;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      text-align: center;
    }

    .result-card h2 {
      margin: 0 0 16px;
      font-size: 32px;
    }

    .result-card p {
      margin: 12px 0;
      font-size: 22px;
      font-weight: 800;
    }

    .result-card button {
      width: 100%;
      margin-top: 12px;
    }

    .all-words-section {
      margin-top: 18px;
      text-align: left;
    }

    .all-words-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }

    .all-words-title {
      font-size: 18px;
      font-weight: 900;
    }

    .all-words-count {
      font-size: 15px;
      font-weight: 700;
      opacity: 0.7;
      white-space: nowrap;
    }

    .legend {
      display: flex;
      gap: 14px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 10px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend-dot.found {
      background: var(--found-border);
    }

    .legend-dot.missed {
      background: var(--missed-border);
    }

    .all-words-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
      padding: 4px 2px;
    }

    .all-word-chip {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 15px;
      font-weight: 800;
      border: 1px solid var(--missed-border);
    }

    .all-word-chip.found {
      background: var(--found-bg);
      border-color: var(--found-border);
      color: var(--found-text);
    }

    .all-word-chip.missed {
      background: var(--missed-bg);
      border-color: var(--missed-border);
      color: var(--missed-text);
    }

    .all-words-empty {
      font-size: 15px;
      opacity: 0.7;
      font-weight: 700;
      padding: 6px 2px;
    }

    @media (max-width: 390px) {
      body {
        padding: 8px;
      }

      .app {
        gap: 9px;
      }

      .panel {
        padding: 9px;
      }

      .board {
        gap: 6px;
      }

      .tile {
        min-height: 62px;
        border-radius: 13px;
        font-size: clamp(40px, 14vw, 58px);
      }

      .status {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
<main class="app">
  <header>
    <h1>Думино</h1>
    <p class="subtitle">Свързвай буквите с пръст</p>
  </header>

  <section class="panel status">
    <div>Точки<br><span id="score">0</span></div>
    <div>Думи<br><span id="wordCount">0</span></div>
    <div>Време<br><span id="timer">1:30</span></div>
  </section>

  <section class="panel">
    <div id="currentWord" class="current-word">Плъзни през буквите</div>
    <div id="message" class="message"></div>
  </section>

  <section class="panel">
    <div id="board" class="board" aria-label="Поле с букви"></div>
  </section>

  <section class="buttons">
    <button id="clearBtn" class="secondary">Изчисти</button>
    <button id="newBtn" class="primary">Нова игра</button>
  </section>

  <section class="panel">
    <h2 class="found-title">Намерени думи</h2>
    <div id="foundWords" class="found-words"></div>
  </section>
</main>

<div id="resultOverlay" class="result-overlay">
  <div class="result-card">
    <h2>Край на играта</h2>
    <p>Намерени думи: <span id="resultCount">0</span></p>
    <p>Най-дълга дума: <span id="resultLongest">—</span></p>
    <p>Точки: <span id="resultScore">0</span></p>

    <div class="all-words-section">
      <div class="all-words-header">
        <span class="all-words-title">Всички думи на таблото</span>
        <span class="all-words-count"><span id="allWordsFoundCount">0</span> / <span id="allWordsTotalCount">0</span></span>
      </div>
      <div class="legend">
        <span><span class="legend-dot found"></span>намерена</span>
        <span><span class="legend-dot missed"></span>пропусната</span>
      </div>
      <div id="allWordsList" class="all-words-list"></div>
    </div>

    <button id="playAgainBtn" class="primary">Играй отново</button>
  </div>
</div>

<script>
  const ROUND_SECONDS = 90;
  const BOARD_SIZE = 4;
  const CELL_COUNT = 16;

  const commonLetters = [
    "А","А","А","А","Е","Е","Е","Е","И","И","И","О","О","О",
    "Н","Н","Н","Р","Р","Р","Т","Т","С","С","Л","Л","К","К",
    "М","М","В","В","Д","Д","П","Б","Г","Я","У","Ъ","Ж","З",
    "Ч","Ш","Ц","Х","Й"
  ];

  let dictionary = new Set();
  let shortWords = [];
  let trieRoot = null;

  let letters = [];
  let selected = [];
  let dragging = false;
  let score = 0;
  let foundWords = new Set();
  let timeLeft = ROUND_SECONDS;
  let timerInterval = null;
  let roundFinished = false;

  const boardEl = document.getElementById("board");
  const currentWordEl = document.getElementById("currentWord");
  const messageEl = document.getElementById("message");
  const scoreEl = document.getElementById("score");
  const wordCountEl = document.getElementById("wordCount");
  const timerEl = document.getElementById("timer");
  const foundWordsEl = document.getElementById("foundWords");
  const clearBtn = document.getElementById("clearBtn");
  const newBtn = document.getElementById("newBtn");

  const resultOverlayEl = document.getElementById("resultOverlay");
  const resultCountEl = document.getElementById("resultCount");
  const resultLongestEl = document.getElementById("resultLongest");
  const resultScoreEl = document.getElementById("resultScore");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const allWordsListEl = document.getElementById("allWordsList");
  const allWordsFoundCountEl = document.getElementById("allWordsFoundCount");
  const allWordsTotalCountEl = document.getElementById("allWordsTotalCount");

  async function loadDictionary() {
    const response = await fetch("words.txt");

    if (!response.ok) {
      throw new Error("Речникът не се зареди.");
    }

    const text = await response.text();

    const words = text
      .split(/\r?\n/)
      .map(word => word.trim().toLocaleLowerCase("bg-BG"))
      .filter(word => /^[а-я]+$/u.test(word))
      .filter(word => word.length >= 3);

    dictionary = new Set(words);
    shortWords = words.filter(word => word.length >= 3 && word.length <= 5);
    trieRoot = buildTrie(words);
  }

  function buildTrie(words) {
    const root = {};

    for (const word of words) {
      let node = root;

      for (const letter of word) {
        if (!node[letter]) {
          node[letter] = {};
        }

        node = node[letter];
      }

      node.isWord = true;
    }

    return root;
  }

  function randomLetter() {
    return commonLetters[Math.floor(Math.random() * commonLetters.length)];
  }

  function shuffled(array) {
    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
  }

  function rowOf(index) {
    return Math.floor(index / BOARD_SIZE);
  }

  function colOf(index) {
    return index % BOARD_SIZE;
  }

  function neighboursOf(index) {
    const result = [];

    for (let rowOffset = -1; rowOffset <= 1; rowOffset++) {
      for (let colOffset = -1; colOffset <= 1; colOffset++) {
        if (rowOffset === 0 && colOffset === 0) continue;

        const row = rowOf(index) + rowOffset;
        const col = colOf(index) + colOffset;

        if (row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE) {
          result.push(row * BOARD_SIZE + col);
        }
      }
    }

    return result;
  }

  function findSimplePath(length) {
    for (let attempt = 0; attempt < 30; attempt++) {
      const path = [];
      const used = new Set();
      let current = Math.floor(Math.random() * CELL_COUNT);

      path.push(current);
      used.add(current);

      while (path.length < length) {
        const options = shuffled(neighboursOf(current))
          .filter(index => !used.has(index));

        if (options.length === 0) break;

        current = options[0];
        path.push(current);
        used.add(current);
      }

      if (path.length === length) {
        return path;
      }
    }

    return null;
  }

  function generateBoard() {
    const board = Array.from({ length: CELL_COUNT }, randomLetter);

    if (shortWords.length === 0) {
      return board;
    }

    const chosen = shuffled(shortWords).slice(0, 7);

    for (const word of chosen) {
      const path = findSimplePath(word.length);

      if (!path) continue;

      const upperWord = word.toLocaleUpperCase("bg-BG");

      path.forEach((cellIndex, letterIndex) => {
        board[cellIndex] = upperWord[letterIndex];
      });
    }

    return board;
  }

  // Намира всички думи от речника, които могат да се съставят на
  // текущото табло, като се движим между съседни (включително по диагонал)
  // плочки, без да минаваме два пъти през една и съща плочка.
  function findAllPossibleWords() {
    const found = new Set();

    if (!trieRoot) {
      return found;
    }

    const visited = new Array(CELL_COUNT).fill(false);
    const wordChars = [];

    function dfs(index, node) {
      const letter = letters[index].toLocaleLowerCase("bg-BG");
      const nextNode = node[letter];

      if (!nextNode) return;

      wordChars.push(letter);
      visited[index] = true;

      if (nextNode.isWord && wordChars.length >= 3) {
        found.add(wordChars.join(""));
      }

      for (const neighbour of neighboursOf(index)) {
        if (!visited[neighbour]) {
          dfs(neighbour, nextNode);
        }
      }

      visited[index] = false;
      wordChars.pop();
    }

    for (let i = 0; i < CELL_COUNT; i++) {
      dfs(i, trieRoot);
    }

    return found;
  }

  function renderAllWords() {
    const allWords = [...findAllPossibleWords()].sort((a, b) => {
      if (a.length !== b.length) return b.length - a.length;
      return a.localeCompare(b, "bg-BG");
    });

    allWordsListEl.innerHTML = "";
    allWordsFoundCountEl.textContent = foundWords.size;
    allWordsTotalCountEl.textContent = allWords.length;

    if (allWords.length === 0) {
      const empty = document.createElement("div");
      empty.className = "all-words-empty";
      empty.textContent = "Няма намерени думи за това табло.";
      allWordsListEl.appendChild(empty);
      return;
    }

    allWords.forEach(word => {
      const wasFound = foundWords.has(word);
      const chip = document.createElement("span");
      chip.className = "all-word-chip " + (wasFound ? "found" : "missed");
      chip.textContent = word.toLocaleUpperCase("bg-BG");
      allWordsListEl.appendChild(chip);
    });
  }

  function createBoard() {
    letters = generateBoard();
    selected = [];
    dragging = false;
    boardEl.innerHTML = "";
    clearMessage();

    letters.forEach((letter, index) => {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.textContent = letter;
      tile.dataset.index = index;

      tile.addEventListener("pointerdown", event => {
        if (roundFinished) return;

        event.preventDefault();
        dragging = true;
        selected = [];
        addTile(index);
      });

      tile.addEventListener("pointermove", event => {
        if (!dragging || roundFinished) return;

        const element = document.elementFromPoint(
          event.clientX,
          event.clientY
        );

        const targetTile = element && element.closest(".tile");

        if (targetTile) {
          addTile(Number(targetTile.dataset.index));
        }
      });

      boardEl.appendChild(tile);
    });

    updateCurrentWord();
  }

  function areAdjacent(a, b) {
    const rowDiff = Math.abs(rowOf(a) - rowOf(b));
    const colDiff = Math.abs(colOf(a) - colOf(b));

    return rowDiff <= 1 &&
           colDiff <= 1 &&
           !(rowDiff === 0 && colDiff === 0);
  }

  function addTile(index) {
    if (selected.includes(index)) return;

    if (selected.length > 0) {
      const previous = selected[selected.length - 1];

      if (!areAdjacent(previous, index)) return;
    }

    selected.push(index);
    renderSelection();
    updateCurrentWord();
  }

  function renderSelection() {
    [...boardEl.children].forEach((tile, index) => {
      tile.classList.toggle("selected", selected.includes(index));
    });
  }

  function currentWord() {
    return selected
      .map(index => letters[index])
      .join("")
      .toLocaleLowerCase("bg-BG");
  }

  function updateCurrentWord() {
    const word = currentWord();

    currentWordEl.textContent = word
      ? word.toLocaleUpperCase("bg-BG")
      : "Плъзни през буквите";
  }

  function finishWord() {
    if (!dragging || roundFinished) return;

    dragging = false;
    const word = currentWord();

    if (word.length < 3) {
      showMessage("Думата трябва да е поне 3 букви.", false);
    } else if (foundWords.has(word)) {
      showMessage("Тази дума вече е намерена.", false);
    } else if (dictionary.has(word)) {
      foundWords.add(word);

      const gained = word.length * word.length;
      score += gained;

      scoreEl.textContent = score;
      wordCountEl.textContent = foundWords.size;

      const chip = document.createElement("span");
      chip.className = "word-chip";
      chip.textContent = word.toLocaleUpperCase("bg-BG");
      foundWordsEl.prepend(chip);

      showMessage("Браво! +" + gained + " точки", true);
    } else {
      showMessage("Не намирам такава дума.", false);
    }

    selected = [];
    renderSelection();
    updateCurrentWord();
  }

  function clearSelection() {
    dragging = false;
    selected = [];
    renderSelection();
    updateCurrentWord();
    clearMessage();
  }

  function updateTimer() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    timerEl.textContent =
      minutes + ":" + String(seconds).padStart(2, "0");
  }

  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = ROUND_SECONDS;
    updateTimer();

    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimer();

      if (timeLeft <= 0) {
        finishRound();
      }
    }, 1000);
  }

  function startNewRound() {
    clearInterval(timerInterval);

    roundFinished = false;
    score = 0;
    foundWords = new Set();
    selected = [];
    dragging = false;

    scoreEl.textContent = "0";
    wordCountEl.textContent = "0";
    foundWordsEl.innerHTML = "";
    resultOverlayEl.classList.remove("visible");

    createBoard();
    startTimer();
  }

  function finishRound() {
    if (roundFinished) return;

    roundFinished = true;
    dragging = false;
    clearInterval(timerInterval);
    timeLeft = 0;
    updateTimer();

    const words = [...foundWords];
    const longestWord = words.reduce(
      (longest, word) =>
        word.length > longest.length ? word : longest,
      ""
    );

    resultCountEl.textContent = words.length;
    resultLongestEl.textContent = longestWord
      ? longestWord.toLocaleUpperCase("bg-BG")
      : "Няма";
    resultScoreEl.textContent = score;

    renderAllWords();

    resultOverlayEl.classList.add("visible");
  }

  function showMessage(text, ok) {
    messageEl.textContent = text;
    messageEl.className = "message " + (ok ? "ok" : "bad");
  }

  function clearMessage() {
    messageEl.textContent = "";
    messageEl.className = "message";
  }

  document.addEventListener("pointerup", finishWord);
  document.addEventListener("pointercancel", clearSelection);

  clearBtn.addEventListener("click", clearSelection);
  newBtn.addEventListener("click", startNewRound);
  playAgainBtn.addEventListener("click", startNewRound);

  loadDictionary()
    .then(startNewRound)
    .catch(error => {
      console.error(error);
      startNewRound();
      showMessage("Речникът не се зареди.", false);
    });
</script>
</body>
</html>
