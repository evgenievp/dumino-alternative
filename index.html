<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f4efe6" />
  <title>Думино</title>

  <style>
    :root {
      --bg: #f4efe6;
      --card: #fffaf2;
      --text: #2f2a24;
      --accent: #5c7c55;
      --accent-dark: #3f5f3a;
      --selected: #f2c66d;
      --border: #d9cfbf;
      --danger: #b04a3f;
      --found-bg: #d9ecc9;
      --found-border: #7fa869;
      --found-text: #2f5c26;
      --missed-bg: #efe9dd;
      --missed-border: #d9cfbf;
      --missed-text: #8a8071;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 8px;
      touch-action: none;
      overflow: hidden;
    }

    .app {
      width: min(100%, 620px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100vh;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(28px, 8vw, 44px);
      line-height: 1;
    }

    .panel {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 8px 12px;
      box-shadow: 0 3px 10px rgba(50, 40, 30, 0.06);
      flex-shrink: 0;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: 800;
    }

    .status span {
      font-size: clamp(18px, 5vw, 26px);
      color: var(--accent-dark);
    }

    .current-word {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(24px, 7vw, 36px);
      font-weight: 900;
      letter-spacing: 2px;
      overflow-wrap: anywhere;
    }

    .message {
      min-height: 22px;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
    }

    .message.ok { color: var(--accent-dark); }
    .message.bad { color: var(--danger); }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      user-select: none;
      flex: 1;
      min-height: 0;
    }

    .tile {
      aspect-ratio: 1 / 1;
      border: 3px solid var(--border);
      border-radius: 14px;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(52px, 16vw, 80px);
      line-height: 1;
      font-weight: 950;
      cursor: pointer;
      transition: transform 0.06s ease, background 0.06s ease;
      touch-action: none;
    }

    .tile.selected {
      background: var(--selected);
      border-color: #c89a3d;
      transform: scale(0.92);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .secondary {
      background: #e7dfd2;
      color: var(--text);
    }

    .found-panel {
      flex-shrink: 0;
      max-height: 80px;
      overflow: hidden;
    }

    .found-title {
      margin: 0 0 4px;
      font-size: 16px;
    }

    .found-words {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      overflow-y: auto;
      max-height: 50px;
    }

    .word-chip {
      background: #e7efdf;
      border: 1px solid #b8c9aa;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 14px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .result-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
      touch-action: auto;
    }

    .result-overlay.visible {
      display: flex;
    }

    .result-card {
      width: min(100%, 460px);
      max-height: min(90vh, 720px);
      overflow-y: auto;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }

    .result-card h2 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .result-card p {
      margin: 8px 0;
      font-size: 20px;
      font-weight: 800;
    }

    .result-card button {
      width: 100%;
      margin-top: 10px;
    }

    .all-words-section {
      margin-top: 14px;
      text-align: left;
    }

    .all-words-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }

    .all-words-title {
      font-size: 16px;
      font-weight: 900;
    }

    .all-words-count {
      font-size: 14px;
      font-weight: 700;
      opacity: 0.7;
    }

    .legend {
      display: flex;
      gap: 12px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 8px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend-dot.found { background: var(--found-border); }
    .legend-dot.missed { background: var(--missed-border); }

    .all-words-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-height: 200px;
      overflow-y: auto;
      padding: 2px;
    }

    .all-word-chip {
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 14px;
      font-weight: 800;
      border: 1px solid var(--missed-border);
    }

    .all-word-chip.found {
      background: var(--found-bg);
      border-color: var(--found-border);
      color: var(--found-text);
    }

    .all-word-chip.missed {
      background: var(--missed-bg);
      border-color: var(--missed-border);
      color: var(--missed-text);
    }

    .loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 2000;
      font-size: 20px;
      font-weight: 800;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 390px) {
      body { padding: 6px; }
      .app { gap: 6px; }
      .panel { padding: 6px 10px; }
      .board { gap: 5px; }
      .tile {
        border-radius: 12px;
        font-size: clamp(48px, 16vw, 64px);
      }
      .status { font-size: 14px; }
      button { padding: 10px 8px; font-size: 16px; }
    }
  </style>
  <base target="_blank">
</head>

<body>
<div id="loadingScreen" class="loading">
  <div class="spinner"></div>
  <div>Зареждане на речника...</div>
</div>

<main class="app">
  <header>
    <h1>Думино</h1>
  </header>

  <section class="panel status">
    <div>Точки<br><span id="score">0</span></div>
    <div>Думи<br><span id="wordCount">0</span></div>
    <div>Време<br><span id="timer">1:30</span></div>
  </section>

  <section class="panel">
    <div id="currentWord" class="current-word"></div>
    <div id="message" class="message"></div>
  </section>

  <section class="panel" style="flex:1; display:flex; flex-direction:column; min-height:0;">
    <div id="board" class="board" aria-label="Поле с букви"></div>
  </section>

  <section class="buttons">
    <button id="clearBtn" class="secondary">Изчисти</button>
    <button id="newBtn" class="primary">Нова игра</button>
  </section>

  <section class="panel found-panel">
    <h2 class="found-title">Намерени думи</h2>
    <div id="foundWords" class="found-words"></div>
  </section>
</main>

<div id="resultOverlay" class="result-overlay">
  <div class="result-card">
    <h2>Край на играта</h2>
    <p>Намерени думи: <span id="resultCount">0</span></p>
    <p>Най-дълга дума: <span id="resultLongest">—</span></p>
    <p>Точки: <span id="resultScore">0</span></p>

    <div class="all-words-section">
      <div class="all-words-header">
        <span class="all-words-title">Всички думи на таблото</span>
        <span class="all-words-count"><span id="allWordsFoundCount">0</span> / <span id="allWordsTotalCount">0</span></span>
      </div>
      <div class="legend">
        <span><span class="legend-dot found"></span>намерена</span>
        <span><span class="legend-dot missed"></span>пропусната</span>
      </div>
      <div id="allWordsList" class="all-words-list"></div>
    </div>

    <button id="playAgainBtn" class="primary">Играй отново</button>
  </div>
</div>

<script>
  const ROUND_SECONDS = 90;
  const BOARD_SIZE = 4;
  const CELL_COUNT = 16;

  const commonLetters = [
    "А","А","А","А","Е","Е","Е","Е","И","И","И","О","О","О",
    "Н","Н","Н","Р","Р","Р","Т","Т","С","С","Л","Л","К","К",
    "М","М","В","В","Д","Д","П","Б","Г","Я","У","Ъ","Ж","З",
    "Ч","Ш","Ц","Х","Й"
  ];

  let dictionary = new Set();
  let shortWords = [];
  let trieRoot = null;
  let allPossibleWordsCache = new Set();

  let letters = [];
  let selected = [];
  let dragging = false;
  let score = 0;
  let foundWords = new Set();
  let timeLeft = ROUND_SECONDS;
  let timerInterval = null;
  let roundFinished = false;
  let worker = null;

  const boardEl = document.getElementById("board");
  const currentWordEl = document.getElementById("currentWord");
  const messageEl = document.getElementById("message");
  const scoreEl = document.getElementById("score");
  const wordCountEl = document.getElementById("wordCount");
  const timerEl = document.getElementById("timer");
  const foundWordsEl = document.getElementById("foundWords");
  const clearBtn = document.getElementById("clearBtn");
  const newBtn = document.getElementById("newBtn");
  const loadingScreen = document.getElementById("loadingScreen");

  const resultOverlayEl = document.getElementById("resultOverlay");
  const resultCountEl = document.getElementById("resultCount");
  const resultLongestEl = document.getElementById("resultLongest");
  const resultScoreEl = document.getElementById("resultScore");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const allWordsListEl = document.getElementById("allWordsList");
  const allWordsFoundCountEl = document.getElementById("allWordsFoundCount");
  const allWordsTotalCountEl = document.getElementById("allWordsTotalCount");

  const workerCode = `
    self.onmessage = function(e) {
      const { letters, trieRoot, action } = e.data;

      if (action === 'findAll') {
        const words = findAllPossibleWords(letters, trieRoot);
        self.postMessage({ type: 'allWords', words: [...words] });
      }
    };

    function findAllPossibleWords(letters, trieRoot) {
      const CELL_COUNT = 16;
      const BOARD_SIZE = 4;
      const found = new Set();

      function rowOf(index) { return Math.floor(index / BOARD_SIZE); }
      function colOf(index) { return index % BOARD_SIZE; }

      function neighboursOf(index) {
        const result = [];
        for (let r = -1; r <= 1; r++) {
          for (let c = -1; c <= 1; c++) {
            if (r === 0 && c === 0) continue;
            const row = rowOf(index) + r;
            const col = colOf(index) + c;
            if (row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE) {
              result.push(row * BOARD_SIZE + col);
            }
          }
        }
        return result;
      }

      const visited = new Array(CELL_COUNT).fill(false);
      const wordChars = [];

      function dfs(index, node) {
        const letter = letters[index].toLowerCase();
        const nextNode = node[letter];
        if (!nextNode) return;

        wordChars.push(letter);
        visited[index] = true;

        if (nextNode.isWord && wordChars.length >= 3) {
          found.add(wordChars.join(""));
        }

        for (const neighbour of neighboursOf(index)) {
          if (!visited[neighbour]) {
            dfs(neighbour, nextNode);
          }
        }

        visited[index] = false;
        wordChars.pop();
      }

      for (let i = 0; i < CELL_COUNT; i++) {
        dfs(i, trieRoot);
      }

      return found;
    }
  `;

  function initWorker() {
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    worker = new Worker(URL.createObjectURL(blob));
    worker.onmessage = function(e) {
      if (e.data.type === 'allWords') {
        allPossibleWordsCache = new Set(e.data.words);
      }
    };
  }

  async function loadDictionary() {
    try {
      const response = await fetch("words.txt");
      if (!response.ok) throw new Error("Речникът не се зареди.");

      const text = await response.text();
      const words = text
        .split(/\r?\n/)
        .map(w => w.trim().toLowerCase())
        .filter(w => /^[а-я]+$/u.test(w))
        .filter(w => w.length >= 3);

      dictionary = new Set(words);
      shortWords = words.filter(w => w.length >= 3 && w.length <= 5);
      trieRoot = buildTrie(words);
      initWorker();

      loadingScreen.style.display = 'none';
      startNewRound();
    } catch (err) {
      console.error(err);
      loadingScreen.innerHTML = '<div>Грешка при зареждане на речника</div>';
    }
  }

  function buildTrie(words) {
    const root = {};
    for (const word of words) {
      let node = root;
      for (const letter of word) {
        if (!node[letter]) node[letter] = {};
        node = node[letter];
      }
      node.isWord = true;
    }
    return root;
  }

  function randomLetter() {
    return commonLetters[Math.floor(Math.random() * commonLetters.length)];
  }

  function shuffled(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function rowOf(index) { return Math.floor(index / BOARD_SIZE); }
  function colOf(index) { return index % BOARD_SIZE; }

  function neighboursOf(index) {
    const result = [];
    for (let r = -1; r <= 1; r++) {
      for (let c = -1; c <= 1; c++) {
        if (r === 0 && c === 0) continue;
        const row = rowOf(index) + r;
        const col = colOf(index) + c;
        if (row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE) {
          result.push(row * BOARD_SIZE + col);
        }
      }
    }
    return result;
  }

  function findSimplePath(length) {
    for (let attempt = 0; attempt < 30; attempt++) {
      const path = [];
      const used = new Set();
      let current = Math.floor(Math.random() * CELL_COUNT);
      path.push(current);
      used.add(current);

      while (path.length < length) {
        const options = shuffled(neighboursOf(current)).filter(i => !used.has(i));
        if (options.length === 0) break;
        current = options[0];
        path.push(current);
        used.add(current);
      }

      if (path.length === length) return path;
    }
    return null;
  }

  function generateBoard() {
    const board = Array.from({ length: CELL_COUNT }, randomLetter);
    if (shortWords.length === 0) return board;

    const chosen = shuffled(shortWords).slice(0, 7);
    for (const word of chosen) {
      const path = findSimplePath(word.length);
      if (!path) continue;
      const upperWord = word.toUpperCase();
      path.forEach((cellIndex, letterIndex) => {
        board[cellIndex] = upperWord[letterIndex];
      });
    }
    return board;
  }

  function createBoard() {
    letters = generateBoard();
    selected = [];
    dragging = false;
    boardEl.innerHTML = "";
    clearMessage();

    letters.forEach((letter, index) => {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.textContent = letter;
      tile.dataset.index = index;

      tile.addEventListener("pointerdown", event => {
        if (roundFinished) return;
        event.preventDefault();
        tile.setPointerCapture(event.pointerId);
        dragging = true;
        selected = [];
        addTile(index);
      });

      tile.addEventListener("pointerenter", event => {
        if (!dragging || roundFinished) return;
        addTile(index);
      });

      tile.addEventListener("pointerup", event => {
        if (dragging) finishWord();
      });

      boardEl.appendChild(tile);
    });

    updateCurrentWord();

    if (worker) {
      worker.postMessage({
        action: 'findAll',
        letters: letters,
        trieRoot: trieRoot
      });
    }
  }

  function areAdjacent(a, b) {
    const rowDiff = Math.abs(rowOf(a) - rowOf(b));
    const colDiff = Math.abs(colOf(a) - colOf(b));
    return rowDiff <= 1 && colDiff <= 1 && !(rowDiff === 0 && colDiff === 0);
  }

  function addTile(index) {
    if (selected.includes(index)) return;
    if (selected.length > 0) {
      const previous = selected[selected.length - 1];
      if (!areAdjacent(previous, index)) return;
    }
    selected.push(index);
    renderSelection();
    updateCurrentWord();
  }

  function renderSelection() {
    [...boardEl.children].forEach((tile, index) => {
      tile.classList.toggle("selected", selected.includes(index));
    });
  }

  function currentWord() {
    return selected.map(index => letters[index]).join("").toLowerCase();
  }

  function updateCurrentWord() {
    const word = currentWord();
    currentWordEl.textContent = word ? word.toUpperCase() : "";
  }

  function finishWord() {
    if (!dragging || roundFinished) return;
    dragging = false;
    const word = currentWord();

    if (word.length < 3) {
      showMessage("Минимум 3 букви", false);
    } else if (foundWords.has(word)) {
      showMessage("Вече намерена", false);
    } else if (dictionary.has(word)) {
      foundWords.add(word);
      const gained = word.length * word.length;
      score += gained;
      scoreEl.textContent = score;
      wordCountEl.textContent = foundWords.size;

      const chip = document.createElement("span");
      chip.className = "word-chip";
      chip.textContent = word.toUpperCase();
      foundWordsEl.prepend(chip);

      showMessage("+" + gained + " точки", true);
    } else {
      showMessage("Няма такава дума", false);
    }

    selected = [];
    renderSelection();
    updateCurrentWord();
  }

  function clearSelection() {
    dragging = false;
    selected = [];
    renderSelection();
    updateCurrentWord();
    clearMessage();
  }

  function updateTimer() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    timerEl.textContent = minutes + ":" + String(seconds).padStart(2, "0");
  }

  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = ROUND_SECONDS;
    updateTimer();

    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimer();
      if (timeLeft <= 0) finishRound();
    }, 1000);
  }

  function startNewRound() {
    clearInterval(timerInterval);
    roundFinished = false;
    score = 0;
    foundWords = new Set();
    selected = [];
    dragging = false;
    allPossibleWordsCache = new Set();

    scoreEl.textContent = "0";
    wordCountEl.textContent = "0";
    foundWordsEl.innerHTML = "";
    resultOverlayEl.classList.remove("visible");

    createBoard();
    startTimer();
  }

  function finishRound() {
    if (roundFinished) return;
    roundFinished = true;
    dragging = false;
    clearInterval(timerInterval);
    timeLeft = 0;
    updateTimer();

    const words = [...foundWords];
    const longestWord = words.reduce((longest, word) =>
      word.length > longest.length ? word : longest, "");

    resultCountEl.textContent = words.length;
    resultLongestEl.textContent = longestWord ? longestWord.toUpperCase() : "Няма";
    resultScoreEl.textContent = score;

    renderAllWords();
    resultOverlayEl.classList.add("visible");
  }

  function renderAllWords() {
    const allWords = [...allPossibleWordsCache].sort((a, b) => {
      if (a.length !== b.length) return b.length - a.length;
      return a.localeCompare(b, "bg-BG");
    });

    allWordsListEl.innerHTML = "";
    allWordsFoundCountEl.textContent = foundWords.size;
    allWordsTotalCountEl.textContent = allWords.length;

    if (allWords.length === 0) {
      const empty = document.createElement("div");
      empty.className = "all-words-empty";
      empty.textContent = "Няма намерени думи за това табло.";
      allWordsListEl.appendChild(empty);
      return;
    }

    allWords.forEach(word => {
      const wasFound = foundWords.has(word);
      const chip = document.createElement("span");
      chip.className = "all-word-chip " + (wasFound ? "found" : "missed");
      chip.textContent = word.toUpperCase();
      allWordsListEl.appendChild(chip);
    });
  }

  function showMessage(text, ok) {
    messageEl.textContent = text;
    messageEl.className = "message " + (ok ? "ok" : "bad");
    setTimeout(() => {
      if (messageEl.textContent === text) clearMessage();
    }, 1500);
  }

  function clearMessage() {
    messageEl.textContent = "";
    messageEl.className = "message";
  }

  clearBtn.addEventListener("click", clearSelection);
  newBtn.addEventListener("click", startNewRound);
  playAgainBtn.addEventListener("click", startNewRound);

  loadDictionary();
</script>
</body>
</html>
